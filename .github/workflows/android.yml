name: Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # blackmarlin's net is a git-lfs object; upstream LFS budget is exceeded,
      # so the smudge filter must not try to fetch it during checkout.
      # The net is downloaded from release assets at build time instead.
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install NDK (runner images ship the Android SDK preinstalled)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
      - name: Build engines (NDK cross-compile)
        run: ./scripts/build_engines.sh
      - name: Assemble debug APK
        run: ./gradlew :DroidFishApp:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: engine-arena-debug-apk
          path: DroidFishApp/build/outputs/apk/debug/*.apk
