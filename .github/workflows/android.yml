name: Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Build engines (NDK cross-compile)
        run: ./scripts/build_engines.sh
      - name: Assemble debug APK
        run: ./gradlew :DroidFishApp:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: engine-arena-debug-apk
          path: DroidFishApp/build/outputs/apk/debug/*.apk
