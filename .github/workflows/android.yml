name: Android APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # blackmarlin's net is a git-lfs object; upstream LFS budget is exceeded,
      # so the smudge filter must not try to fetch it during checkout.
      # The net is downloaded from release assets at build time instead.
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up NDK (runner images ship the Android SDK preinstalled)
        run: |
          set -x
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$SDK/ndk" || true
          NDK_HOME=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_HOME" ]; then
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses >/dev/null || true
            "$SDKM" "ndk;25.2.9519653" "cmake;3.22.1"
            NDK_HOME="$SDK/ndk/25.2.9519653"
          fi
          echo "Using NDK at $NDK_HOME"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
      - name: Build engines (NDK cross-compile)
        run: ./scripts/build_engines.sh
      - name: Verify all 3 engine binaries exist (arm64 gate)
        run: |
          ls -la engines/bin/arm64-v8a/
          for id in stockfish ravager patricia; do
            test -s "engines/bin/arm64-v8a/lib$id.so" || { echo "MISSING lib$id.so"; exit 1; }
          done
      - name: Publish engine build logs to build-logs branch
        if: always()
        continue-on-error: true
        run: |
          git clone -q --depth 1 --branch build-logs "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" /tmp/blog || { git clone -q --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" /tmp/blog && git -C /tmp/blog checkout -qb build-logs; }
          mkdir -p /tmp/blog/logs
          cp /tmp/ea-*.log /tmp/blog/logs/ 2>/dev/null || true
          { echo "run ${{ github.run_number }} sha ${{ github.sha }}"; date -u; } > /tmp/blog/logs/RUN.txt
          git -C /tmp/blog config user.email ci@enginearena.local
          git -C /tmp/blog config user.name "CI logbot"
          git -C /tmp/blog add -A
          git -C /tmp/blog commit -qm "engine build logs (run ${{ github.run_number }})" && git -C /tmp/blog push -q origin build-logs || echo "log push failed (non-fatal)"
      - name: Package engine zips (binary + LICENSE per engine per ABI)
        run: |
          mkdir -p engines/dist
          for dir in engines/bin/*; do
            abi=$(basename "$dir")
            for so in "$dir"/*.so; do
              [ -e "$so" ] || continue
              id=$(basename "$so" .so); id=${id#lib}
              lic=$(find "engines/src/$id" -maxdepth 2 -iname 'LICENSE*' -o -maxdepth 2 -iname 'COPYING*' 2>/dev/null | head -1)
              if [ -n "$lic" ]; then zip -j "engines/dist/${id}-${abi}.zip" "$so" "$lic"; else zip -j "engines/dist/${id}-${abi}.zip" "$so"; fi
            done
          done
          ls -la engines/dist/
      - name: Publish engines-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: engines-latest
          name: Engine packs (latest)
          files: engines/dist/*.zip
      - name: Assemble debug APK
        run: ./gradlew :DroidFishApp:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: engine-arena-debug-apk
          path: DroidFishApp/build/outputs/apk/debug/*.apk
