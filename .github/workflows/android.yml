name: Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # blackmarlin's net is a git-lfs object; upstream LFS budget is exceeded,
      # so the smudge filter must not try to fetch it during checkout.
      # The net is downloaded from release assets at build time instead.
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up NDK (runner images ship the Android SDK preinstalled)
        run: |
          set -x
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$SDK/ndk" || true
          NDK_HOME=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_HOME" ]; then
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses >/dev/null || true
            "$SDKM" "ndk;25.2.9519653" "cmake;3.22.1"
            NDK_HOME="$SDK/ndk/25.2.9519653"
          fi
          echo "Using NDK at $NDK_HOME"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
      - name: Build engines (NDK cross-compile)
        run: ./scripts/build_engines.sh
      - name: Package engine zips (binary + LICENSE per engine per ABI)
        run: |
          mkdir -p engines/dist
          for dir in engines/bin/*; do
            abi=$(basename "$dir")
            for so in "$dir"/*.so; do
              [ -e "$so" ] || continue
              id=$(basename "$so" .so); id=${id#lib}
              lic=$(find "engines/src/$id" -maxdepth 2 -iname 'LICENSE*' -o -maxdepth 2 -iname 'COPYING*' 2>/dev/null | head -1)
              if [ -n "$lic" ]; then zip -j "engines/dist/${id}-${abi}.zip" "$so" "$lic"; else zip -j "engines/dist/${id}-${abi}.zip" "$so"; fi
            done
          done
          ls -la engines/dist/
      - name: Publish engines-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: engines-latest
          name: Engine packs (latest)
          files: engines/dist/*.zip
      - name: Assemble debug APK
        run: ./gradlew :DroidFishApp:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: engine-arena-debug-apk
          path: DroidFishApp/build/outputs/apk/debug/*.apk
